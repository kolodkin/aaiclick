# The `aaiclick` distribution: no code, installs aaiclick-client with every extra.
# shortcut: the 0.0.0 version and the missing ==version pin are filled in by meta/build.sh at release.
[build-system]
requires = ["setuptools>=82.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aaiclick"
version = "0.0.0"
description = "Data orchestration framework on ClickHouse: plain-Python pipelines, dynamic task graphs, containerized runs, lineage over MCP"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["aaiclick-client[all]"]

[project.urls]
Homepage = "https://github.com/kolodkin/aaiclick"
Repository = "https://github.com/kolodkin/aaiclick"
Documentation = "https://aaiclick.readthedocs.io"

[tool.setuptools]
packages = []
