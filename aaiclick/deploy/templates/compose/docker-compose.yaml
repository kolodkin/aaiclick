# Starter docker-compose stack for an aaiclick docker-runner deployment.
#
# Scaffolded by `python -m aaiclick compose init` — customize freely; you
# own this file. Every credential is a ${...} reference to the `.env` file
# `compose init` wrote next to it, one value per secret; keep `.env` out of
# version control. The server refuses to start with the raw template's
# placeholders. The full list is in docs/user_guide/deployment.md.
#
# Task containers spawned by the docker runner run as SIBLINGS on the host
# docker daemon (the worker mounts /var/run/docker.sock). They cannot
# resolve compose service names, so everything a task needs (ClickHouse,
# Postgres, the registry) is published on host ports and addressed via
# host.docker.internal in the worker's environment.
#
# Image builds run on the rootless `buildkitd` service, not on the host daemon:
# Dockerfile steps never see the worker's credentials or docker.sock. It needs
# host-gateway to push to the host-published registry, so build steps can
# still reach the host-published Postgres / ClickHouse ports — compose has no
# egress control. The helm chart isolates builds with a NetworkPolicy.

name: aaiclick

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.10
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: "${AAICLICK_CH_PASSWORD:?run python -m aaiclick compose init}"
      CLICKHOUSE_DB: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 0
      # Blob storage: the server's S3 identity (see the clickhouse_s3_xml config below).
      # AWS_ACCESS_KEY_ID: "..."
      # AWS_SECRET_ACCESS_KEY: "..."
    configs:
      - source: clickhouse_s3_xml
        target: /etc/clickhouse-server/users.d/s3.xml
    ports:
      - "8123:8123"
      - "9000:9000"
    # Lets ClickHouse fetch url()/insert-from-URL sources served from the
    # host (e.g. a local fileserver), matching the repo's dev compose file.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: aaiclick
      POSTGRES_PASSWORD: "${AAICLICK_PG_PASSWORD:?run python -m aaiclick compose init}"
      POSTGRES_DB: aaiclick
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "aaiclick"]
      interval: 5s
      timeout: 3s
      retries: 10

  registry:
    image: registry:2
    ports:
      - "5000:5000"

  buildkitd:
    image: moby/buildkit:v0.33.1-rootless
    command: ["--addr", "tcp://0.0.0.0:1234"]
    # Rootless BuildKit needs these to nest its build sandbox; it is the only
    # container in the stack with relaxed confinement, and it runs as non-root.
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - systempaths=unconfined
    extra_hosts:
      - "host.docker.internal:host-gateway"
    configs:
      - source: buildkitd_toml
        target: /home/user/.config/buildkit/buildkitd.toml
    volumes:
      - buildkit_cache:/home/user/.local/share/buildkit

  migrate:
    image: ghcr.io/kolodkin/aaiclick:__AAICLICK_IMAGE_TAG__
    command: python -m aaiclick migrate upgrade head
    environment:
      AAICLICK_SQL_URL: postgresql+asyncpg://aaiclick:${AAICLICK_PG_PASSWORD}@postgres:5432/aaiclick
      AAICLICK_CH_URL: clickhouse://default:${AAICLICK_CH_PASSWORD}@clickhouse:8123/default
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: "no"

  server:
    image: ghcr.io/kolodkin/aaiclick:__AAICLICK_IMAGE_TAG__
    ports:
      - "5255:5255"
    environment:
      AAICLICK_SQL_URL: postgresql+asyncpg://aaiclick:${AAICLICK_PG_PASSWORD}@postgres:5432/aaiclick
      AAICLICK_CH_URL: clickhouse://default:${AAICLICK_CH_PASSWORD}@clickhouse:8123/default
      # Distributed URLs enforce auth: no signing secret means the server
      # refuses to start. The admin is seeded on first startup (username: admin).
      AAICLICK_JWT_SECRET: "${AAICLICK_JWT_SECRET:?run python -m aaiclick compose init}"
      AAICLICK_ADMIN_PASSWORD: "${AAICLICK_ADMIN_PASSWORD:?run python -m aaiclick compose init}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy

  worker:
    image: ghcr.io/kolodkin/aaiclick-docker:__AAICLICK_IMAGE_TAG__
    command: python -m aaiclick execution-worker start
    # Root so the mounted docker socket is writable. Alternative: keep the
    # image's non-root user and add `group_add: ["<host docker gid>"]`.
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # host.docker.internal DSNs resolve BOTH here (extra_hosts above) and
      # inside spawned task containers (AAICLICK_DOCKER_RUN_ADD_HOST below),
      # so tasks inherit working connection strings verbatim.
      AAICLICK_SQL_URL: postgresql+asyncpg://aaiclick:${AAICLICK_PG_PASSWORD}@host.docker.internal:5432/aaiclick
      AAICLICK_CH_URL: clickhouse://default:${AAICLICK_CH_PASSWORD}@host.docker.internal:8123/default
      AAICLICK_RUNNER: docker
      AAICLICK_REGISTRY: host.docker.internal:5000
      AAICLICK_BUILDKIT_ADDR: tcp://buildkitd:1234
      AAICLICK_DOCKER_BUILD_ADD_HOST: host.docker.internal:host-gateway
      AAICLICK_DOCKER_RUN_ADD_HOST: host.docker.internal:host-gateway
    depends_on:
      migrate:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      buildkitd:
        condition: service_started

  background:
    image: ghcr.io/kolodkin/aaiclick:__AAICLICK_IMAGE_TAG__
    command: python -m aaiclick background start
    environment:
      AAICLICK_SQL_URL: postgresql+asyncpg://aaiclick:${AAICLICK_PG_PASSWORD}@postgres:5432/aaiclick
      AAICLICK_CH_URL: clickhouse://default:${AAICLICK_CH_PASSWORD}@clickhouse:8123/default
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  clickhouse_data:
  postgres_data:
  buildkit_cache:

configs:
  clickhouse_s3_xml:
    content: |
      <clickhouse>
        <!-- Blob storage (export to a bucket, open_object_from_url): uncomment
             to let queries use this server's own S3 identity, and give the
             server AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY or an IAM role.
        <profiles>
          <default>
            <s3_allow_server_credentials_in_user_queries>1</s3_allow_server_credentials_in_user_queries>
          </default>
        </profiles>
        -->
      </clickhouse>
  buildkitd_toml:
    # The scaffold's registry is plain HTTP on the host gateway.
    content: |
      [registry."host.docker.internal:5000"]
        http = true
        insecure = true
