# Execution worker. AAICLICK_RUNNER=kubernetes turns container tasks
# (--image / --build jobs) into Pods created via the ServiceAccount below
# using the kubectl in the aaiclick-kubectl image; tasks without an image run
# in-place as subprocesses. One replica drives many Pods at once (bounded by
# the cluster, see AAICLICK_K8S_MAX_* in docs/designs/kubernetes_runner.md)
# and re-adopts them after a restart, so replicas are for availability, not
# throughput. Git-sourced images build on the chart's buildkitd
# (buildkitd.yaml) and are pushed to env.registry.
{{- $githubApp := .Values.githubApp }}
{{- if and $githubApp.appId (not $githubApp.secretName) }}
{{- fail "githubApp.appId is set but githubApp.secretName is empty: set both, or neither" }}
{{- end }}
{{- if and $githubApp.secretName (not $githubApp.appId) }}
{{- fail "githubApp.secretName is set but githubApp.appId is empty: set both, or neither" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aaiclick-worker
  labels:
    app: aaiclick-worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app: aaiclick-worker
  template:
    metadata:
      labels:
        app: aaiclick-worker
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- if $githubApp.appId }}
      # The image runs as non-root aaiclick (gid 1000), which could not read
      # a root-owned Secret file.
      securityContext:
        fsGroup: 1000
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The server becomes ready only after its migrate initContainer has
      # completed, so gating on server health serializes worker startup
      # behind migrations — the same ordering the compose scaffold uses.
      initContainers:
        - name: wait-for-server
          image: "{{ .Values.images.worker.repository }}:{{ .Values.images.worker.tag }}"
          command:
            - /bin/sh
            - -c
            - >-
              until python -c "import urllib.request;
              urllib.request.urlopen('http://aaiclick-server:{{ .Values.server.service.port }}/health', timeout=2)";
              do echo "waiting for aaiclick-server"; sleep 3; done
      containers:
        - name: worker
          image: "{{ .Values.images.worker.repository }}:{{ .Values.images.worker.tag }}"
          command: ["python", "-m", "aaiclick", "execution-worker", "start"]
          env:
            - name: AAICLICK_SQL_URL
              value: {{ include "aaiclick.sqlUrl" . | quote }}
            - name: AAICLICK_CH_URL
              value: {{ include "aaiclick.chUrl" . | quote }}
            - name: AAICLICK_RUNNER
              value: "kubernetes"
            - name: AAICLICK_K8S_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: AAICLICK_K8S_SERVICE_ACCOUNT
              value: {{ .Values.serviceAccount.name | quote }}
            {{- if .Values.buildkit.enabled }}
            - name: AAICLICK_BUILDKIT_ADDR
              value: "tcp://aaiclick-buildkitd:1234"
            {{- end }}
            {{- if .Values.env.registry }}
            - name: AAICLICK_REGISTRY
              value: {{ .Values.env.registry | quote }}
            {{- end }}
            {{- if $githubApp.appId }}
            # An unquoted number in values.yaml parses as a float; print it whole.
            - name: AAICLICK_GITHUB_APP_ID
              value: {{ if kindIs "float64" $githubApp.appId }}{{ int64 $githubApp.appId | quote }}{{ else }}{{ $githubApp.appId | quote }}{{ end }}
            - name: AAICLICK_GITHUB_APP_PEM_FILE
              value: /run/secrets/github-app/github-app.pem
            {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          {{- if $githubApp.appId }}
          volumeMounts:
            - name: github-app
              mountPath: /run/secrets/github-app
              readOnly: true
          {{- end }}
      {{- if $githubApp.appId }}
      volumes:
        - name: github-app
          secret:
            secretName: {{ $githubApp.secretName | quote }}
            defaultMode: 0440
      {{- end }}
