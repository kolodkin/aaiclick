{{- if .Values.devDependencies.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aaiclick-clickhouse
  labels:
    app: aaiclick-clickhouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aaiclick-clickhouse
  template:
    metadata:
      labels:
        app: aaiclick-clickhouse
      annotations:
        # A subPath mount never sees ConfigMap updates: roll the pod instead.
        checksum/users-d: {{ .Values.devDependencies.clickhouse.s3UsersXml | sha256sum }}
    spec:
      containers:
        - name: clickhouse
          image: {{ .Values.devDependencies.clickhouse.image }}
          env:
            - name: CLICKHOUSE_USER
              value: {{ .Values.devDependencies.clickhouse.user | quote }}
            - name: CLICKHOUSE_PASSWORD
              value: {{ .Values.devDependencies.clickhouse.password | quote }}
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "0"
            {{- with .Values.devDependencies.clickhouse.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: users-d
              mountPath: /etc/clickhouse-server/users.d/s3.xml
              subPath: s3.xml
          ports:
            - containerPort: 8123
            - containerPort: 9000
          readinessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
      volumes:
        - name: users-d
          configMap:
            name: aaiclick-clickhouse-users
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aaiclick-clickhouse-users
data:
  s3.xml: |
    {{- .Values.devDependencies.clickhouse.s3UsersXml | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: aaiclick-clickhouse
  labels:
    app: aaiclick-clickhouse
spec:
  selector:
    app: aaiclick-clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: 8123
    - name: native
      port: 9000
      targetPort: 9000
{{- end }}
