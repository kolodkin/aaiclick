apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
{{- if .Values.rbac.create }}
---
# The kubernetes runner creates one pod per task via kubectl and reads its
# logs, so the worker needs exactly these verbs in its own namespace. A shell
# task's in.json / out.json move through kubectl cp / exec (pods/exec). Each
# Pod's env (a module task's runner env with the DB URLs, a shell task's
# command_env) rides in a per-attempt Secret, never in the Pod spec or on the
# kubectl argv; the worker creates and deletes it but never reads it back.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aaiclick-worker
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aaiclick-worker
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
roleRef:
  kind: Role
  name: aaiclick-worker
  apiGroup: rbac.authorization.k8s.io
{{- end }}
