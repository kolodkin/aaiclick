[project]
name = "chdb-benchmark"
version = "0.1.0"
description = "Benchmark comparing aaiclick Object API against native chdb SQL"
requires-python = ">=3.11"

dependencies = [
    "aaiclick",
    # Listed so its source below applies: uv honours sources for direct dependencies only.
    "aaiclick-client",
    "rich>=13.0",
]

# The monorepo checkout, not a PyPI release — examples always exercise this tree.
[tool.uv.sources]
aaiclick = { path = "../../meta" }
aaiclick-client = { path = "../..", editable = true }
