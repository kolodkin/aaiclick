[project]
name = "cyber-threat-feeds"
version = "0.1.0"
description = "Multi-source cybersecurity pipeline with CISA KEV, Shodan CVEDB, and FIRST EPSS"
requires-python = ">=3.11"

dependencies = [
    "aaiclick",
    # Listed so its source below applies: uv honours sources for direct dependencies only.
    "aaiclick-client",
]

# The monorepo checkout, not a PyPI release — examples always exercise this tree.
[tool.uv.sources]
aaiclick = { path = "../../meta" }
aaiclick-client = { path = "../..", editable = true }
