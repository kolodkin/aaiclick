name: Build base image
description: >-
  Build the aaiclick base image (docker/Dockerfile) from a wheel served by
  the local pypiserver on port 8080. Shared by the release's per-arch rc
  build and the docker e2e's source mode. --network=host reaches the index
  on localhost, which pip trusts for plain HTTP; docker/ is the context so
  the workspace is not sent to the daemon.

inputs:
  version:
    description: "Version of the wheel to install; a leading v is dropped."
    required: true
  tag:
    description: "Image reference to tag the result with."
    required: true

runs:
  using: composite
  steps:
    - name: Build base image
      shell: bash
      run: |
        VERSION="${{ inputs.version }}"
        docker build --network=host -f docker/Dockerfile \
          --build-arg AAICLICK_VERSION="${VERSION#v}" \
          --build-arg PIP_INDEX_URL="http://localhost:8080/simple/" \
          -t "${{ inputs.tag }}" docker/
