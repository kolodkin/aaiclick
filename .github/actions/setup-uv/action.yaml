name: Setup uv
description: >-
  Install uv with dependency caching and optionally sync the project
  environment. Wraps the setup-uv + `uv sync --frozen` pair repeated across
  every workflow job.

inputs:
  python-version:
    description: "Python version passed to `uv sync --python`."
    required: false
    default: "3.10"
  sync-args:
    description: >-
      Extra arguments for `uv sync --frozen` (e.g. "--extra test --extra
      server"). Empty skips the sync entirely for jobs that install another
      way (venv + pip, artifact installs).
    required: false
    default: ""
  cache-dependency-glob:
    description: "Glob(s) whose changes invalidate the uv cache."
    required: false
    default: "pyproject.toml"
  uv-version:
    description: >-
      uv release to install, pinned so a new upstream release cannot change
      what CI runs without a commit. Note this does not avoid setup-uv's
      version-manifest fetch from raw.githubusercontent.com — it makes that
      request whether or not a version is given.
    required: false
    default: "0.12.7"

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: ${{ inputs.uv-version }}
        enable-cache: true
        cache-dependency-glob: ${{ inputs.cache-dependency-glob }}

    - name: Sync dependencies
      shell: bash
      run: |
        if [ -n "${{ inputs.sync-args }}" ]; then
          uv sync --frozen ${{ inputs.sync-args }} --python ${{ inputs.python-version }}
        fi
