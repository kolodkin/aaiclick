name: Start buildkitd
description: >-
  Run a buildkitd for the e2e build tasks, as the deploy scaffolds run one
  beside the worker. Host networking lets it reach the loopback registry the
  worker and kubelet use (localhost:5000, plain HTTP) and the test pypi; the
  worker reaches it at tcp://127.0.0.1:1234. Rootful + privileged keeps CI
  independent of the runner's user-namespace policy.

runs:
  using: composite
  steps:
    - name: Start buildkitd
      shell: bash
      run: |
        mkdir -p /tmp/buildkit
        cat > /tmp/buildkit/buildkitd.toml <<'TOML'
        [registry."localhost:5000"]
          http = true
          insecure = true
        [registry."host.docker.internal:5000"]
          http = true
          insecure = true
        TOML
        docker run -d --name buildkitd --privileged --network host \
          -v /tmp/buildkit:/etc/buildkit \
          moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea \
          --addr tcp://127.0.0.1:1234
        for _ in $(seq 30); do
          docker exec buildkitd buildctl --addr tcp://127.0.0.1:1234 debug workers >/dev/null 2>&1 && exit 0
          sleep 1
        done
        docker logs buildkitd
        exit 1
