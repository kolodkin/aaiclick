name: Log in to GHCR
description: >-
  Log the runner's docker daemon in to ghcr.io with the workflow token.
  The caller's job needs ``packages: read`` (``write`` to push).

runs:
  using: composite
  steps:
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
