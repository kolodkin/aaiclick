name: tests (reusable)

# Shared matrix body for the test workflows. ``test.yaml`` (PR / push,
# pinned to 3.10 — the project's minimum) and ``test-py-nightly.yaml``
# (nightly matrix over 3.10 and 3.14) both call this and differ only in
# the ``python-version`` input.

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version passed to ``uv sync --python``."
        required: true
        type: string
      gc-leak-check:
        description: >-
          Force gc.collect() at each test boundary (+ PYTHONASYNCIODEBUG) in
          the dist jobs to surface aiohttp connection leaks as deterministic
          failures. Slow — nightly only; off for the per-PR suite.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  checks: write

env:
  # dorny/test-reporter@v2 uses Node.js 20 (deprecated on GH Actions from June 2026).
  # No v3 exists yet — opt into Node.js 24 early to silence the deprecation warning.
  # Remove once dorny/test-reporter releases a Node.js 24-compatible version.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --frozen --extra dev --python ${{ inputs.python-version }}

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  test-local:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: ${{ matrix.group }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - group: Data local
            test-paths: "aaiclick/data/ aaiclick/snowflake/"
            extras: ""
          - group: Orch local
            test-paths: "aaiclick/orchestration/ aaiclick/oplog/"
            extras: ""
          - group: Internal API local
            test-paths: "aaiclick/internal_api/"
            extras: ""
          - group: Server local
            test-paths: "aaiclick/server/"
            extras: "--extra server"
          - group: AI local
            test-paths: "aaiclick/ai/"
            extras: "--extra ai"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: |
          uv sync --frozen --extra test ${{ matrix.extras }} --python ${{ inputs.python-version }}

      - name: Setup local backend
        run: |
          uv run python -m aaiclick setup

      - name: Run tests
        run: |
          mkdir -p tmp
          uv run pytest ${{ matrix.test-paths }} -n auto -v --junitxml=tmp/pytest-report.xml

      - name: Publish test results
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: "Pytest Results (${{ matrix.group }})"
          path: tmp/pytest-report.xml
          reporter: java-junit

  test-dist:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: ${{ matrix.group }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - group: Data dist
            test-paths: "aaiclick/data/ aaiclick/snowflake/"
            extras: ""
          - group: Orch dist
            test-paths: "aaiclick/orchestration/ aaiclick/oplog/"
            extras: ""
          - group: Internal API dist
            test-paths: "aaiclick/internal_api/"
            extras: ""
          - group: Server dist
            test-paths: "aaiclick/server/"
            extras: "--extra server"

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.3
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: click123
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 0
        ports:
          - 8123:8123
          - 9000:9000
        options: >-
          --health-cmd "wget --spider -q localhost:8123/ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --add-host=host.docker.internal:host-gateway

      postgres:
        image: postgres:18.3
        env:
          POSTGRES_USER: aaiclick
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: aaiclick
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aaiclick"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: |
          uv sync --frozen --extra distributed --extra test ${{ matrix.extras }} --python ${{ inputs.python-version }}

      - name: Run database migrations
        env:
          AAICLICK_SQL_URL: "postgresql+asyncpg://aaiclick:secret@localhost:5432/aaiclick"
        run: |
          echo "Running database migrations..."
          uv run python -m aaiclick migrate upgrade head

      - name: Run tests
        env:
          AAICLICK_CH_URL: "clickhouse://default:click123@localhost:8123/default"
          AAICLICK_SQL_URL: "postgresql+asyncpg://aaiclick:secret@localhost:5432/aaiclick"
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PORT: 8123
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: click123
          CLICKHOUSE_DB: default
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: aaiclick
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: aaiclick
          # Distributed mode enforces auth; the server suite needs a signing
          # secret (app_client mints an admin token from it).
          AAICLICK_JWT_SECRET: ci-test-jwt-secret-key-at-least-32-bytes-long
          AAICLICK_TEST_FILESERVER_HOST: host.docker.internal
          # Leak-detection harness (nightly only). Empty string = off, so the
          # per-PR suite is unaffected. See aaiclick/testing.py:gc_leak_check.
          AAICLICK_GC_LEAK_CHECK: ${{ inputs.gc-leak-check && '1' || '' }}
          PYTHONASYNCIODEBUG: ${{ inputs.gc-leak-check && '1' || '' }}
        run: |
          mkdir -p tmp
          uv run pytest ${{ matrix.test-paths }} -n auto -v --junitxml=tmp/pytest-report.xml

      - name: Publish test results
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: "Pytest Results (${{ matrix.group }})"
          path: tmp/pytest-report.xml
          reporter: java-junit

  test-ui-e2e-dist:
    # Single browser smoke pass against the distributed backend: builds the
    # Vite bundle, launches uvicorn pointed at PG + ClickHouse, and drives
    # the SPA shell with Playwright. Catches packaging/wiring regressions
    # that the local-backend pytest suites can't see.
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: UI e2e dist

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.3
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: click123
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 0
        ports:
          - 8123:8123
          - 9000:9000
        options: >-
          --health-cmd "wget --spider -q localhost:8123/ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:18.3
        env:
          POSTGRES_USER: aaiclick
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: aaiclick
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aaiclick"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Python dependencies
        run: |
          uv sync --frozen --extra distributed --extra server --extra test --python ${{ inputs.python-version }}
          uv pip install playwright

      - name: Resolve Playwright version
        id: pw-version
        run: echo "version=$(uv run playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Chromium for Playwright
        # On a cache hit only install the OS deps; on a miss download Chromium too.
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            uv run playwright install-deps chromium
          else
            uv run playwright install --with-deps chromium
          fi

      - name: Build SPA bundle
        run: |
          npm ci
          npm run build
          test -f aaiclick/server/static/index.html

      - name: Run database migrations
        env:
          AAICLICK_SQL_URL: "postgresql+asyncpg://aaiclick:secret@localhost:5432/aaiclick"
        run: uv run python -m aaiclick migrate upgrade head

      - name: Run UI smoke against distributed backend
        env:
          AAICLICK_CH_URL: "clickhouse://default:click123@localhost:8123/default"
          AAICLICK_SQL_URL: "postgresql+asyncpg://aaiclick:secret@localhost:5432/aaiclick"
          # Distributed mode enforces auth: the server seeds this admin on
          # startup and the smoke logs in through the SPA before asserting.
          AAICLICK_JWT_SECRET: ci-test-jwt-secret-key-at-least-32-bytes-long
          AAICLICK_ADMIN_USERNAME: admin
          AAICLICK_ADMIN_PASSWORD: ci-admin-password
        run: |
          mkdir -p tmp
          uv run pytest test_e2e/web/test_smoke.py -v --junitxml=tmp/pytest-report.xml

      - name: Publish test results
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: "Pytest Results (UI e2e dist)"
          path: tmp/pytest-report.xml
          reporter: java-junit

  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: ${{ matrix.group }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - group: Data examples
            module: aaiclick.data.examples.run_all
            summary-title: Data Examples Output
            needs-postgres: false
            extras: distributed
          - group: Orch examples
            module: aaiclick.orchestration.examples.run_all
            summary-title: Orchestration Examples Output
            needs-postgres: true
            extras: distributed

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.3
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: click123
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 0
        ports:
          - 8123:8123
          - 9000:9000
        options: >-
          --health-cmd "wget --spider -q localhost:8123/ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:18.3
        env:
          POSTGRES_USER: aaiclick
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: aaiclick
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aaiclick"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: |
          uv sync --frozen --extra ${{ matrix.extras }} --python ${{ inputs.python-version }}

      - name: Run database migrations
        if: matrix.needs-postgres
        env:
          AAICLICK_SQL_URL: "postgresql+asyncpg://aaiclick:secret@localhost:5432/aaiclick"
        run: |
          uv run python -m aaiclick migrate upgrade head

      - name: Run examples
        env:
          AAICLICK_CH_URL: "clickhouse://default:click123@localhost:8123/default"
          AAICLICK_SQL_URL: "postgresql+asyncpg://aaiclick:secret@localhost:5432/aaiclick"
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PORT: 8123
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: click123
          CLICKHOUSE_DB: default
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: aaiclick
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: aaiclick
          AAICLICK_LOG_DIR: /tmp/aaiclick/logs
        run: |
          mkdir -p tmp
          uv run python -m ${{ matrix.module }} 2>&1 | tee tmp/examples_output.txt
          exit ${PIPESTATUS[0]}

      - name: Add example outputs to summary
        if: always()
        run: |
          uv run python .github/scripts/generate_summary.py --title "${{ matrix.summary-title }}"
