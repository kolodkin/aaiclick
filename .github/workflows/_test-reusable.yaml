name: tests (reusable)

# Shared matrix body for the test workflows. ``test.yaml`` (PR / push,
# pinned to 3.10 — the project's minimum) and ``test-py-nightly.yaml``
# (nightly matrix over 3.10 and 3.14) both call this and differ only in
# the ``python-version`` input.
#
# The ClickHouse / Postgres service blocks are YAML-anchored at their first
# use (test-dist) and aliased by the later jobs — GitHub Actions supports
# anchors/aliases (not merge keys) since 2025-09.

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version passed to ``uv sync --python``."
        required: true
        type: string
      gc-leak-check:
        description: >-
          Force gc.collect() at each test boundary (+ PYTHONASYNCIODEBUG) in
          the dist jobs to surface aiohttp connection leaks as deterministic
          failures. Slow — nightly only; off for the per-PR suite.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  checks: write

env:
  # dorny/test-reporter@v2 uses Node.js 20 (deprecated on GH Actions from June 2026).
  # No v3 exists yet — opt into Node.js 24 early to silence the deprecation warning.
  # Remove once dorny/test-reporter releases a Node.js 24-compatible version.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup uv
        uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ inputs.python-version }}
          sync-args: "--extra dev"

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  frontend:
    # SPA gates: regenerate the OpenAPI-derived TypeScript types and fail if
    # they drift from the server schema, then static-type-check the SPA.
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Frontend types
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup uv
        uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ inputs.python-version }}
          sync-args: "--extra server"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Regenerate API types from the OpenAPI schema
        run: npm run gen-types

      - name: Fail if generated types are stale
        run: git diff --exit-code src/api/schema.ts

      - name: Type-check the SPA
        run: npm run check

  test-local:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: ${{ matrix.group }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - group: Data local
            test-paths: "aaiclick/data/ aaiclick/snowflake/ aaiclick/data_extra_tests/"
            extras: ""
          - group: Orch local
            test-paths: "aaiclick/orchestration/ aaiclick/oplog/"
            extras: ""
          - group: Internal API local
            test-paths: "aaiclick/internal_api/ aaiclick/auth/"
            extras: ""
          - group: Server local
            test-paths: "aaiclick/server/"
            extras: "--extra server"
          - group: AI local
            test-paths: "aaiclick/ai/"
            extras: "--extra ai"
          - group: Misc local
            # Backend-independent tests with no package directory of their
            # own: deploy scaffolds, the argparse CLI, and view/log models.
            test-paths: "aaiclick/deploy/ aaiclick/test_cli.py aaiclick/test_view_models.py aaiclick/test_log_models.py"
            extras: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup uv
        uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ inputs.python-version }}
          sync-args: "--extra test ${{ matrix.extras }}"

      - name: Setup local backend
        run: |
          uv run python -m aaiclick setup

      - name: Run tests
        uses: ./.github/actions/run-pytest
        with:
          command: uv run pytest ${{ matrix.test-paths }} -n auto -v
          report-name: "Pytest Results (${{ matrix.group }})"

  test-dist:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: ${{ matrix.group }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - group: Data dist
            test-paths: "aaiclick/data/ aaiclick/snowflake/ aaiclick/data_extra_tests/"
            extras: ""
          - group: Orch dist
            test-paths: "aaiclick/orchestration/ aaiclick/oplog/"
            extras: ""
          - group: Internal API dist
            test-paths: "aaiclick/internal_api/ aaiclick/auth/"
            extras: ""
          - group: Server dist
            test-paths: "aaiclick/server/"
            extras: "--extra server"

    services:
      # The --add-host mapping is only needed by test-dist (containers
      # spawned by the suite reach back to the runner), but it is harmless
      # for the aliasing jobs, so all three share one anchored definition.
      clickhouse: &clickhouse-service
        image: clickhouse/clickhouse-server:26.3
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: click123
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 0
        ports:
          - 8123:8123
          - 9000:9000
        options: >-
          --health-cmd "wget --spider -q localhost:8123/ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --add-host=host.docker.internal:host-gateway

      postgres: &postgres-service
        image: postgres:18.3
        env:
          POSTGRES_USER: aaiclick
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: aaiclick
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aaiclick"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup uv
        uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ inputs.python-version }}
          sync-args: "--extra distributed --extra test ${{ matrix.extras }}"

      - name: Run database migrations
        env:
          AAICLICK_SQL_URL: "postgresql+asyncpg://aaiclick:secret@localhost:5432/aaiclick"
          AAICLICK_CH_URL: "clickhouse://default:click123@localhost:8123/default"
        run: |
          echo "Running database migrations..."
          uv run python -m aaiclick migrate upgrade head

      - name: Run tests
        env:
          AAICLICK_CH_URL: "clickhouse://default:click123@localhost:8123/default"
          AAICLICK_SQL_URL: "postgresql+asyncpg://aaiclick:secret@localhost:5432/aaiclick"
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PORT: 8123
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: click123
          CLICKHOUSE_DB: default
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: aaiclick
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: aaiclick
          # Distributed mode enforces auth; the server suite needs a signing
          # secret (app_client mints an admin token from it).
          AAICLICK_JWT_SECRET: ci-test-jwt-secret-key-at-least-32-bytes-long
          AAICLICK_TEST_FILESERVER_HOST: host.docker.internal
          # Leak-detection harness (nightly only). Empty string = off, so the
          # per-PR suite is unaffected. See aaiclick/testing.py:gc_leak_check.
          AAICLICK_GC_LEAK_CHECK: ${{ inputs.gc-leak-check && '1' || '' }}
          PYTHONASYNCIODEBUG: ${{ inputs.gc-leak-check && '1' || '' }}
        uses: ./.github/actions/run-pytest
        with:
          command: uv run pytest ${{ matrix.test-paths }} -n auto -v
          report-name: "Pytest Results (${{ matrix.group }})"

  test-ui-e2e-dist:
    # Single browser smoke pass against the distributed backend: builds the
    # Vite bundle, launches uvicorn pointed at PG + ClickHouse, and drives
    # the SPA shell with Playwright. Catches packaging/wiring regressions
    # that the local-backend pytest suites can't see.
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: UI e2e dist

    services:
      clickhouse: *clickhouse-service
      postgres: *postgres-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup uv
        uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ inputs.python-version }}
          sync-args: "--extra distributed --extra server --extra test"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Playwright
        run: uv pip install playwright

      - name: Resolve Playwright version
        id: pw-version
        run: echo "version=$(uv run playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Chromium for Playwright
        # On a cache hit only install the OS deps; on a miss download Chromium too.
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            uv run playwright install-deps chromium
          else
            uv run playwright install --with-deps chromium
          fi

      - name: Build SPA bundle
        run: |
          npm ci
          npm run build
          test -f aaiclick/server/static/index.html

      - name: Run database migrations
        env:
          AAICLICK_SQL_URL: "postgresql+asyncpg://aaiclick:secret@localhost:5432/aaiclick"
          AAICLICK_CH_URL: "clickhouse://default:click123@localhost:8123/default"
        run: uv run python -m aaiclick migrate upgrade head

      - name: Run UI smoke against distributed backend
        env:
          AAICLICK_CH_URL: "clickhouse://default:click123@localhost:8123/default"
          AAICLICK_SQL_URL: "postgresql+asyncpg://aaiclick:secret@localhost:5432/aaiclick"
          # Distributed mode enforces auth: the server seeds this admin on
          # startup and the smoke logs in through the SPA before asserting.
          AAICLICK_JWT_SECRET: ci-test-jwt-secret-key-at-least-32-bytes-long
          AAICLICK_ADMIN_USERNAME: admin
          AAICLICK_ADMIN_PASSWORD: ci-admin-password
        uses: ./.github/actions/run-pytest
        with:
          command: uv run pytest test_e2e/web/test_smoke.py -v
          report-name: "Pytest Results (UI e2e dist)"

  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: ${{ matrix.group }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - group: Data examples
            module: aaiclick.data.examples.run_all
            summary-title: Data Examples Output
            needs-postgres: false
            extras: distributed
          - group: Orch examples
            module: aaiclick.orchestration.examples.run_all
            summary-title: Orchestration Examples Output
            needs-postgres: true
            extras: distributed

    services:
      clickhouse: *clickhouse-service
      postgres: *postgres-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup uv
        uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ inputs.python-version }}
          sync-args: "--extra ${{ matrix.extras }}"

      - name: Run database migrations
        if: matrix.needs-postgres
        env:
          AAICLICK_SQL_URL: "postgresql+asyncpg://aaiclick:secret@localhost:5432/aaiclick"
          AAICLICK_CH_URL: "clickhouse://default:click123@localhost:8123/default"
        run: |
          uv run python -m aaiclick migrate upgrade head

      - name: Run examples
        env:
          AAICLICK_CH_URL: "clickhouse://default:click123@localhost:8123/default"
          AAICLICK_SQL_URL: "postgresql+asyncpg://aaiclick:secret@localhost:5432/aaiclick"
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PORT: 8123
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: click123
          CLICKHOUSE_DB: default
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: aaiclick
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: aaiclick
          AAICLICK_LOG_DIR: /tmp/aaiclick/logs
        run: |
          mkdir -p tmp
          uv run python -m ${{ matrix.module }} 2>&1 | tee tmp/examples_output.txt
          exit ${PIPESTATUS[0]}

      - name: Add example outputs to summary
        if: always()
        run: |
          uv run python .github/scripts/generate_summary.py --title "${{ matrix.summary-title }}"
