name: Compose Stack E2E (reusable)

# Release gate for the reference docker-compose stack (deploy/compose):
# installs the wheel artifact, generates .env with env.init.sh (the exact
# first-run path users take), points the image tag at the -rc candidates,
# brings the stack up, and runs test_e2e/compose/.

on:
  workflow_call:
    inputs:
      image_tag:
        description: "GHCR image tag to deploy (e.g. v1.2.3-rc)"
        required: true
        type: string

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Overrides .env's AAICLICK_IMAGE_TAG for every compose command in the job.
    env:
      AAICLICK_IMAGE_TAG: ${{ inputs.image_tag }}
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup uv
        uses: ./.github/actions/setup-uv

      - name: Install pinned dependencies and built wheel
        uses: ./.github/actions/install-dist
        with:
          requirements-file: requirements-dist.txt

      - name: Log in to GHCR
        uses: ./.github/actions/ghcr-login

      - name: Prepare compose stack
        run: |
          cp -r deploy/compose "$RUNNER_TEMP/stack"
          sh "$RUNNER_TEMP/stack/env.init.sh"

      - name: Start stack
        working-directory: ${{ runner.temp }}/stack
        run: docker compose up -d --quiet-pull

      - name: Wait for server health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5255/health >/dev/null 2>&1; then
              echo "server healthy"; exit 0
            fi
            sleep 5
          done
          echo "server never became healthy" >&2
          exit 1

      - name: Run compose e2e tests
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
          AAICLICK_E2E_COMPOSE_DIR: ${{ runner.temp }}/stack
        uses: ./.github/actions/run-pytest
        with:
          command: >-
            uv run --no-project pytest test_e2e/compose/ -m compose_e2e -n 0 -v
            -o asyncio_mode=auto
            -o asyncio_default_fixture_loop_scope=module
            -o asyncio_default_test_loop_scope=module
            -o "filterwarnings=error"
            --strict-markers
          report-name: "Compose Stack E2E"

      - name: Dump compose logs on failure
        if: failure()
        working-directory: ${{ runner.temp }}/stack
        run: docker compose logs --tail 200

      - name: Tear down stack
        if: always()
        working-directory: ${{ runner.temp }}/stack
        run: docker compose down -v
