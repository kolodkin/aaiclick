name: test-py-nightly

# Nightly leg covering the supported-Python range plus the in-development
# release. PR CI (test.yaml) only runs the 3.10 minimum; this workflow
# re-verifies 3.10 alongside 3.14 (latest stable) and 3.15 (next dev) so
# a fix tailored to one version can't silently regress the others between
# PR merges, and so we catch upcoming-Python breakage early.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write

concurrency:
  group: test-py-nightly
  cancel-in-progress: false

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14", "3.15"]
    uses: ./.github/workflows/_test-reusable.yaml
    with:
      python-version: ${{ matrix.python-version }}
