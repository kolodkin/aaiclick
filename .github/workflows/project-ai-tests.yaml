name: project-ai-tests

on:
  schedule:
    - cron: '0 6 * * *'  # Nightly at 06:00 UTC
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: read
  checks: write

concurrency:
  group: project-ai-tests
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AAICLICK_AI_MODEL: ollama/llama3.2:1b
  AAICLICK_AI_LIVE_TESTS: "1"

jobs:
  ai-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: ${{ matrix.group }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: ai-provider
            test-path: aaiclick/ai/test_provider_live.py
          - group: ai-lineage
            test-path: aaiclick/ai/agents/test_lineage_agent_live.py

    services:
      ollama:
        image: ollama/ollama:latest
        env:
          OLLAMA_HOST: 0.0.0.0
        ports:
          - 11434:11434
        volumes:
          - /home/runner/.ollama:/root/.ollama
        options: >-
          --health-cmd "bash -c 'echo > /dev/tcp/localhost/11434'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup uv
        uses: ./.github/actions/setup-uv
        with:
          sync-args: "--extra ai --extra test"

      - name: Cache Ollama model
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-llama3.2-1b

      - name: Setup local backend and pull model
        run: uv run python -m aaiclick setup --ai

      - name: Run AI tests
        uses: ./.github/actions/run-pytest
        with:
          command: uv run pytest ${{ matrix.test-path }} -m live_llm -v
          report-name: "Pytest Results (${{ matrix.group }})"
