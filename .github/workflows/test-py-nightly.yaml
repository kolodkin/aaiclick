name: test-py-nightly

# Nightly leg covering both ends of the supported-Python range. PR CI
# (test.yaml) only runs the 3.11 minimum; this workflow re-verifies 3.11
# alongside 3.14 (the newest the deps support) so a fix tailored to one version
# can't silently regress the other between PR merges.
#
# 3.15 is intentionally not in the matrix yet — pydantic-core publishes no
# cp315 wheels (pyarrow does from 26.x). Add it once pydantic-core does.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write

concurrency:
  group: test-py-nightly
  cancel-in-progress: false

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    uses: ./.github/workflows/_test-reusable.yaml
    with:
      python-version: ${{ matrix.python-version }}
      # Surface aiohttp connection leaks (e.g. clickhouse-connect's async
      # client) as deterministic, attributable failures. Nightly-only — too
      # slow for the per-PR suite. See aaiclick/testing.py:gc_leak_check.
      gc-leak-check: true
