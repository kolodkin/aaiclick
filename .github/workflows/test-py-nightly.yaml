name: test-py-nightly

# Nightly leg covering both ends of the supported-Python range. PR CI
# (test.yaml) only runs the 3.10 minimum; this workflow re-verifies 3.10
# alongside 3.14 (the latest stable) so a fix tailored to one version
# can't silently regress the other between PR merges.
#
# 3.15 is intentionally not in the matrix yet — pyo3 0.26.0 caps at 3.14,
# so transitive deps like tiktoken (via litellm) and pydantic-core can't
# build against it. Re-add once those publish 3.15-compatible wheels.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write

concurrency:
  group: test-py-nightly
  cancel-in-progress: false

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    uses: ./.github/workflows/_test-reusable.yaml
    with:
      python-version: ${{ matrix.python-version }}
