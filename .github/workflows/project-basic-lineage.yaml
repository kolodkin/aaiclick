name: project-basic-lineage

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: read
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AAICLICK_AI_MODEL: nvidia_nim/meta/llama-3.1-8b-instruct

jobs:
  basic-lineage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml\naaiclick/example_projects/basic_lineage/uv.lock"

      - name: Install dependencies
        run: |
          uv sync --frozen --extra ai --python 3.10

      - name: Setup local backend
        run: uv run python -m aaiclick setup

      - name: Run Basic Lineage Example
        env:
          PYTHON: "uv run --project ${{ github.workspace }} python"
          AAICLICK_LOG_DIR: /tmp/aaiclick/logs
          AAICLICK_AI_API_KEY: ${{ secrets.AAICLICK_AI_API_KEY }}
        run: |
          mkdir -p tmp
          aaiclick/example_projects/basic_lineage/basic_lineage.sh 2>&1 | tee tmp/basic-lineage_output.txt
          exit ${PIPESTATUS[0]}

      - name: Add output to summary
        if: always()
        run: |
          echo "<details>" >> $GITHUB_STEP_SUMMARY
          echo "<summary>Basic Lineage Example</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat tmp/basic-lineage_output.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No output captured" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY
