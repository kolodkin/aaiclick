name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (must match vX.Y.Z)"
        required: true
        type: string
      pre-release:
        description: "Mark as pre-release on GitHub"
        required: false
        type: boolean
        default: false
      skip-docker-e2e:
        description: "Skip the docker e2e release gate (emergency only)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        run: |
          if ! echo "${{ inputs.tag }}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: tag '${{ inputs.tag }}' does not match vX.Y.Z"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Build SPA bundle
        run: |
          npm ci
          npm run build
          test -f aaiclick/server/static/index.html \
            || { echo "Vite build did not produce aaiclick/server/static/index.html"; exit 1; }

      - name: Build package
        run: |
          VERSION="${{ inputs.tag }}"
          SETUPTOOLS_SCM_PRETEND_VERSION="${VERSION#v}" uv build

      - name: Verify wheel contains SPA bundle
        run: |
          wheel=$(ls dist/aaiclick-*.whl | head -n 1)
          unzip -l "$wheel" | grep -q "aaiclick/server/static/index.html" \
            || { echo "Built wheel $wheel does not contain aaiclick/server/static/index.html"; exit 1; }

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

      - name: Export pinned dependencies (local backend)
        run: uv export --frozen --extra test --no-emit-project -o requirements-local.txt

      - name: Export pinned dependencies (distributed backend)
        run: uv export --frozen --extra test --extra distributed --no-emit-project -o requirements-dist.txt

      - name: Upload requirements artifacts
        uses: actions/upload-artifact@v6
        with:
          name: requirements
          path: |
            requirements-local.txt
            requirements-dist.txt

  build-rc-images:
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-latest
          - platform: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE_PREFIX: ghcr.io/kolodkin
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download dist artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      # The images pip-install aaiclick==<version>. The wheel is not on
      # PyPI yet (publish is gated on these very images), so serve the
      # artifact from a local pypiserver; it redirects unknown packages
      # to pypi.org, so dependencies resolve through the same index URL.
      - name: Serve wheel via local pypiserver
        run: |
          docker run -d --name pypiserver -p 8080:8080 \
            pypiserver/pypiserver:v2.3.2 run -p 8080 -a . -P . --server gunicorn
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/simple/ >/dev/null 2>&1 && break
            sleep 2
          done
          for f in dist/*.whl dist/*.tar.gz; do
            curl -fsSL -F "content=@${f}" -F ":action=file_upload" http://localhost:8080/
          done

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Native per-arch builds (no QEMU). The three images are FROM-chained,
      # so they build sequentially within each platform leg. --network=host
      # lets the build reach the pypiserver on localhost; pip trusts
      # localhost for plain HTTP by default.
      - name: Build & push per-arch rc images
        run: |
          VERSION="${{ inputs.tag }}"
          PEP440="${VERSION#v}"
          ARCH_TAG="${VERSION}-rc-${{ matrix.platform }}"
          docker build --network=host -f docker/Dockerfile \
            --build-arg AAICLICK_VERSION="${PEP440}" \
            --build-arg PIP_INDEX_URL="http://localhost:8080/simple/" \
            -t "${IMAGE_PREFIX}/aaiclick:${ARCH_TAG}" .
          docker build -f docker/docker.Dockerfile \
            --build-arg BASE_REF="${IMAGE_PREFIX}/aaiclick:${ARCH_TAG}" \
            --build-arg TARGETARCH="${{ matrix.platform }}" \
            -t "${IMAGE_PREFIX}/aaiclick-docker:${ARCH_TAG}" .
          docker build -f docker/kubectl.Dockerfile \
            --build-arg BASE_REF="${IMAGE_PREFIX}/aaiclick-docker:${ARCH_TAG}" \
            --build-arg TARGETARCH="${{ matrix.platform }}" \
            -t "${IMAGE_PREFIX}/aaiclick-kubectl:${ARCH_TAG}" .
          docker push "${IMAGE_PREFIX}/aaiclick:${ARCH_TAG}"
          docker push "${IMAGE_PREFIX}/aaiclick-docker:${ARCH_TAG}"
          docker push "${IMAGE_PREFIX}/aaiclick-kubectl:${ARCH_TAG}"

  merge-rc-images:
    needs: build-rc-images
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        image: [aaiclick, aaiclick-docker, aaiclick-kubectl]
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble multi-arch rc manifest
        run: |
          REF="ghcr.io/kolodkin/${{ matrix.image }}"
          TAG="${{ inputs.tag }}-rc"
          docker buildx imagetools create -t "${REF}:${TAG}" \
            "${REF}:${TAG}-amd64" "${REF}:${TAG}-arm64"

  test-package-local:
    needs: build
    runs-on: ubuntu-latest
    name: test-package-local (${{ matrix.group }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: data
            pyargs: aaiclick.data aaiclick.snowflake
          - group: orch
            pyargs: aaiclick.orchestration aaiclick.oplog

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Create virtual environment
        run: uv venv --python 3.10

      - name: Download dist artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Download requirements artifacts
        uses: actions/download-artifact@v7
        with:
          name: requirements

      - name: Install pinned dependencies and built wheel
        run: |
          uv pip install -r requirements-local.txt
          uv pip install --no-deps --no-index --find-links dist/ aaiclick

      - name: Setup local backend
        run: uv run --no-project python -m aaiclick setup

      - name: Run tests against installed package (local backend)
        working-directory: /tmp
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
        run: >-
          uv run --no-project pytest --pyargs ${{ matrix.pyargs }} -n auto -v
          -o asyncio_mode=auto
          -o asyncio_default_fixture_loop_scope=module
          -o asyncio_default_test_loop_scope=module
          -o "filterwarnings=error"
          -o "markers=live_llm: tests that call a real LLM — requires AAICLICK_AI_LIVE_TESTS=1 and a reachable model"
          --strict-markers
          --junitxml=/tmp/pytest-report.xml

  test-package:
    needs: [build, merge-rc-images]
    runs-on: ubuntu-latest
    name: test-package (${{ matrix.group }})
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: data
            pyargs: aaiclick.data aaiclick.snowflake
          - group: orch
            pyargs: aaiclick.orchestration aaiclick.oplog

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Create virtual environment
        run: uv venv --python 3.10

      - name: Download dist artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Download requirements artifacts
        uses: actions/download-artifact@v7
        with:
          name: requirements

      - name: Install pinned dependencies and built wheel
        run: |
          uv pip install -r requirements-dist.txt
          uv pip install --no-deps --no-index --find-links dist/ "aaiclick[distributed]"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Infra comes from the same compose file users scaffold — the release
      # dogfoods it instead of GHA `services:` blocks. The whole stack comes
      # up (no profiles); the extra app services are harmless to the suite.
      - name: Scaffold and start compose stack
        run: |
          mkdir -p "$RUNNER_TEMP/stack"
          uv run --no-project python -m aaiclick compose init \
            --path "$RUNNER_TEMP/stack/docker-compose.yaml" \
            --image-tag "${{ inputs.tag }}-rc"
          docker compose -f "$RUNNER_TEMP/stack/docker-compose.yaml" up -d --quiet-pull

      - name: Wait for infra health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8123/ping >/dev/null 2>&1 \
               && docker compose -f "$RUNNER_TEMP/stack/docker-compose.yaml" exec -T postgres pg_isready -U aaiclick >/dev/null 2>&1; then
              echo "infra healthy"; exit 0
            fi
            sleep 5
          done
          echo "infra never became healthy" >&2
          exit 1

      - name: Run database migrations
        env:
          AAICLICK_SQL_URL: "postgresql+asyncpg://aaiclick:secret@localhost:5432/aaiclick"
        run: uv run --no-project python -m aaiclick migrate upgrade head

      - name: Run tests against installed package (distributed backend)
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
          AAICLICK_CH_URL: "clickhouse://default:click123@localhost:8123/default"
          AAICLICK_SQL_URL: "postgresql+asyncpg://aaiclick:secret@localhost:5432/aaiclick"
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PORT: 8123
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: click123
          CLICKHOUSE_DB: default
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: aaiclick
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: aaiclick
          AAICLICK_TEST_FILESERVER_HOST: host.docker.internal
        working-directory: /tmp
        run: >-
          uv run --no-project pytest --pyargs ${{ matrix.pyargs }} -n auto -v
          -o asyncio_mode=auto
          -o asyncio_default_fixture_loop_scope=module
          -o asyncio_default_test_loop_scope=module
          -o "filterwarnings=error"
          -o "markers=live_llm: tests that call a real LLM — requires AAICLICK_AI_LIVE_TESTS=1 and a reachable model"
          --strict-markers
          --junitxml=/tmp/pytest-report.xml

      - name: Tear down stack
        if: always()
        run: docker compose -f "$RUNNER_TEMP/stack/docker-compose.yaml" down -v

  test-package-docker-e2e:
    needs: build
    if: ${{ !inputs.skip-docker-e2e }}
    uses: ./.github/workflows/_docker-e2e-reusable.yaml
    with:
      wheel_source: artifact
      version_pin: ${{ inputs.tag }}

  test-compose-e2e:
    permissions:
      contents: read
      packages: read
    needs: [build, merge-rc-images]
    uses: ./.github/workflows/_compose-e2e-reusable.yaml
    with:
      version_pin: ${{ inputs.tag }}
      image_tag: ${{ inputs.tag }}-rc

  test-helm-e2e:
    permissions:
      contents: read
      packages: read
    needs: [build, merge-rc-images]
    uses: ./.github/workflows/_helm-e2e-reusable.yaml
    with:
      version_pin: ${{ inputs.tag }}
      image_tag: ${{ inputs.tag }}-rc

  publish:
    needs: [test-package-local, test-package, test-package-docker-e2e, test-compose-e2e]
    if: >-
      always()
      && needs.test-package-local.result == 'success'
      && needs.test-package.result == 'success'
      && (needs.test-package-docker-e2e.result == 'success'
          || needs.test-package-docker-e2e.result == 'skipped')
      && needs.test-compose-e2e.result == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download dist artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ inputs.tag }}
          git push origin ${{ inputs.tag }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ inputs.tag }} dist/* \
            --title "${{ inputs.tag }}" \
            --generate-notes \
            ${{ inputs.pre-release && '--prerelease' || '' }}

  publish-image:
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_PREFIX: ghcr.io/kolodkin

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Compute PEP 440 version
        id: vars
        run: |
          VERSION="${{ inputs.tag }}"
          echo "pep440=${VERSION#v}" >> "$GITHUB_OUTPUT"

      # The image installs aaiclick==<version> from PyPI, so wait for the
      # just-published wheel to become resolvable before building.
      - name: Wait for version on PyPI
        run: |
          VERSION="${{ steps.vars.outputs.pep440 }}"
          for i in $(seq 1 30); do
            if curl -fsSL "https://pypi.org/pypi/aaiclick/${VERSION}/json" >/dev/null 2>&1; then
              echo "aaiclick ${VERSION} is on PyPI"; exit 0
            fi
            echo "waiting for aaiclick ${VERSION} on PyPI (attempt $i)"; sleep 10
          done
          echo "timed out waiting for aaiclick ${VERSION} on PyPI" >&2; exit 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (base)
        id: meta-base
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/aaiclick
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=raw,value=latest,enable=${{ !inputs.pre-release }}

      - name: Build & push base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            AAICLICK_VERSION=${{ steps.vars.outputs.pep440 }}
          tags: ${{ steps.meta-base.outputs.tags }}
          labels: ${{ steps.meta-base.outputs.labels }}

      - name: Metadata (docker variant)
        id: meta-docker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/aaiclick-docker
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=raw,value=latest,enable=${{ !inputs.pre-release }}

      - name: Build & push docker variant
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/docker.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE_REF=${{ env.IMAGE_PREFIX }}/aaiclick:${{ inputs.tag }}
          tags: ${{ steps.meta-docker.outputs.tags }}
          labels: ${{ steps.meta-docker.outputs.labels }}

      - name: Metadata (kubectl variant)
        id: meta-kubectl
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/aaiclick-kubectl
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=raw,value=latest,enable=${{ !inputs.pre-release }}

      - name: Build & push kubectl variant
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/kubectl.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE_REF=${{ env.IMAGE_PREFIX }}/aaiclick-docker:${{ inputs.tag }}
          tags: ${{ steps.meta-kubectl.outputs.tags }}
          labels: ${{ steps.meta-kubectl.outputs.labels }}
