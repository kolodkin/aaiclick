name: Docker Runner E2E (nightly)

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      echo_task_output:
        description: "Also print task output to the job log, besides task_logs (debug missing logs)"
        type: boolean
        default: false

jobs:
  e2e:
    uses: ./.github/workflows/_docker-e2e-reusable.yaml
    with:
      wheel_source: source
      # Scheduled runs have no inputs, so this stays false.
      echo_task_output: ${{ inputs.echo_task_output == true }}
