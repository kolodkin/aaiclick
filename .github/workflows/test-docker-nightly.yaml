name: Docker Runner E2E (nightly)

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  test-docker-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.3
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: click123
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 0
        ports:
          - 8123:8123
          - 9000:9000
        options: >-
          --health-cmd "wget --spider -q localhost:8123/ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --add-host=host.docker.internal:host-gateway

      postgres:
        image: postgres:18.3
        env:
          POSTGRES_USER: aaiclick
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: aaiclick
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aaiclick"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      registry:
        image: registry:2
        ports:
          - 5000:5000

      pypiserver:
        image: pypiserver/pypiserver:v2.3.2
        ports:
          - 8080:8080
        options: >-
          --health-cmd "wget --spider -q localhost:8080/"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --frozen --extra distributed --extra test --python 3.10

      - name: Build wheel
        run: uv build

      - name: Upload wheel to test pypi
        run: |
          for f in dist/*.whl dist/*.tar.gz; do
            curl -fsSL -F "content=@${f}" -F "action=file_upload" http://localhost:8080/
          done

      - name: Run database migrations
        env:
          AAICLICK_SQL_URL: "postgresql+asyncpg://aaiclick:secret@localhost:5432/aaiclick"
        run: uv run python -m aaiclick migrate upgrade head

      - name: Run docker e2e tests
        env:
          AAICLICK_SQL_URL: "postgresql+asyncpg://aaiclick:secret@host.docker.internal:5432/aaiclick"
          AAICLICK_CH_URL: "clickhouse://default:click123@host.docker.internal:8123/default"
          AAICLICK_DOCKER_REGISTRY: "host.docker.internal:5000"
          AAICLICK_PIP_INDEX_URL: "http://host.docker.internal:8080/simple/"
        run: |
          export AAICLICK_E2E_AAICLICK_VERSION=$(uv run python -c \
            'from importlib.metadata import version; print(version("aaiclick"))')
          mkdir -p tmp
          uv run pytest test_e2e/docker/ -m docker_e2e -n 0 -v \
            --junitxml=tmp/pytest-report.xml

      - name: Publish test results
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: "Docker Runner E2E (nightly)"
          path: tmp/pytest-report.xml

      - name: Cleanup docker resources
        if: always()
        run: docker system prune -af
