name: project-example

# One parameterized workflow for the example projects that run against the
# distributed backend (ClickHouse + Postgres service containers). The three
# projects previously had byte-identical workflows differing only in the
# project name.
#
# The project script is expected at
# example_projects/<project>/<project>.sh.

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Example project to run"
        required: true
        type: choice
        options:
          - basic_worker
          - nyc_taxi_pipeline
          - cyber_threat_feeds
          - imdb_dataset_builder
          - movie_plot_rag
      args:
        description: "Extra arguments for the project script"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      project:
        description: "Example project to run (directory name under example_projects/)"
        required: true
        type: string
      args:
        description: "Extra arguments for the project script"
        required: false
        type: string
        default: ""
    secrets:
      AAICLICK_AI_API_KEY:
        description: "Hosted-model key for movie_plot_rag (AAICLICK_AI_MODEL names the model)"
        required: false

permissions:
  contents: read
  actions: read
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-project:
    name: ${{ inputs.project }}
    runs-on: ubuntu-latest

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.7
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: click123
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 0
        ports:
          - 8123:8123
          - 9000:9000
        options: >-
          --health-cmd "wget --spider -q localhost:8123/ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: aaiclick
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: aaiclick
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aaiclick"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup uv
        uses: ./.github/actions/setup-uv
        with:
          sync-args: "--extra dev --extra examples"
          cache-dependency-glob: "pyproject.toml\nuv.lock\nexample_projects/${{ inputs.project }}/uv.lock"

      - name: Run database migrations
        env:
          AAICLICK_SQL_URL: "postgresql+asyncpg://aaiclick:secret@localhost:5432/aaiclick"
          AAICLICK_CH_URL: "clickhouse://default:click123@localhost:8123/default"
        run: |
          uv run python -m aaiclick migrate upgrade head

      - name: Run example project
        env:
          PYTHON: "uv run --project ${{ github.workspace }} python"
          AAICLICK_CH_URL: "clickhouse://default:click123@localhost:8123/default"
          AAICLICK_SQL_URL: "postgresql+asyncpg://aaiclick:secret@localhost:5432/aaiclick"
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PORT: 8123
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: click123
          CLICKHOUSE_DB: default
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: aaiclick
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: aaiclick
          AAICLICK_AI_MODEL: ${{ vars.AAICLICK_AI_MODEL }}
          AAICLICK_AI_API_KEY: ${{ secrets.AAICLICK_AI_API_KEY }}
        run: |
          mkdir -p tmp
          example_projects/${{ inputs.project }}/${{ inputs.project }}.sh ${{ inputs.args }} 2>&1 \
            | tee tmp/project_output.txt
          exit ${PIPESTATUS[0]}

      - name: Add output to summary
        if: always()
        run: |
          TITLE=$(echo "${{ inputs.project }}" | tr '_' ' ' | sed 's/\b\(.\)/\u\1/g')
          echo "<details>" >> $GITHUB_STEP_SUMMARY
          echo "<summary>${TITLE}</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat tmp/project_output.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No output captured" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY
