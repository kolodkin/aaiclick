name: pypiserver service spike

# Throwaway probe: can a GitHub Actions `services:` container run a custom
# command? pypiserver needs `run -a . -P .` to disable auth. If the service
# honours `command:`, an UNAUTHENTICATED upload returns 200; if the key is
# ignored (default CMD = auth on) it returns 401; if the key is unsupported the
# workflow fails to start. Delete this workflow once answered.

on:
  push:
    branches: [claude/kubernetes-runner-support-rxv9hm]
    paths: [.github/workflows/pypiserver-svc-spike.yaml]
  workflow_dispatch:

jobs:
  spike:
    runs-on: ubuntu-latest
    services:
      pypiserver:
        image: pypiserver/pypiserver:v2.3.2
        command: run -p 8080 -a . -P . --server gunicorn
        ports:
          - 8080:8080
    steps:
      - name: Probe unauthenticated upload
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/ -o /dev/null && break
            sleep 1
          done
          echo "dummy" > /tmp/spikepkg-0.0.0.tar.gz
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -F "content=@/tmp/spikepkg-0.0.0.tar.gz" -F ":action=file_upload" \
            http://localhost:8080/)
          echo "unauthenticated upload -> HTTP $code"
          if [ "$code" = "200" ]; then
            echo "RESULT: services CAN run a custom command (command: honoured)"
          else
            echo "RESULT: command NOT applied (HTTP $code) — auth still on"
          fi
          test "$code" = "200"
