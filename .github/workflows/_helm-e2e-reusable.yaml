name: Helm Chart E2E (reusable)

# Release gate for the published helm chart (deploy/helm/aaiclick): lints
# it, installs it on a k3s cluster with devDependencies enabled and the -rc
# images, smoke-tests server health and a shell-job round trip, then checks
# that `helm upgrade` keeps the generated credentials.

on:
  workflow_call:
    inputs:
      image_tag:
        description: "GHCR image tag to deploy (e.g. v1.2.3-rc)"
        required: true
        type: string

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup uv
        uses: ./.github/actions/setup-uv

      - name: Log in to GHCR
        uses: ./.github/actions/ghcr-login

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: bash deploy/helm/check.sh

      - name: Install k3s and Helm
        uses: ./.github/actions/setup-k3s

      # k3s's containerd can't use the host's registry credentials, so pull on
      # the host and side-load the images into the cluster.
      - name: Load rc images into k3s
        run: |
          for img in aaiclick aaiclick-kubectl; do
            docker pull "ghcr.io/kolodkin/${img}:${{ inputs.image_tag }}"
            docker save "ghcr.io/kolodkin/${img}:${{ inputs.image_tag }}" | sudo k3s ctr images import -
          done

      - name: Install chart
        run: |
          helm install aaiclick deploy/helm/aaiclick \
            --set devDependencies.enabled=true \
            --set images.server.tag="${{ inputs.image_tag }}" \
            --set images.worker.tag="${{ inputs.image_tag }}" \
            --wait --timeout 15m

      - name: "Smoke: server health via port-forward"
        run: |
          kubectl port-forward svc/aaiclick-server 5255:5255 &
          PF_PID=$!
          trap "kill $PF_PID" EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5255/health >/dev/null 2>&1; then
              echo "server healthy"; exit 0
            fi
            sleep 2
          done
          echo "server never became healthy" >&2
          exit 1

      - name: "Smoke: shell job round trip"
        run: |
          kubectl exec deploy/aaiclick-server -- \
            python -m aaiclick register-job aaiclick.orchestration.examples.orchestration_basic.simple_arithmetic \
              --name helm-smoke
          kubectl exec deploy/aaiclick-server -- \
            python -m aaiclick run-job helm-smoke --entry-type shell --command "python -c 'print(42)'"
          for i in $(seq 1 60); do
            STATUS=$(kubectl exec deploy/aaiclick-server -- \
              python -m aaiclick job list --json \
              | python3 -c "import json,sys; jobs=json.load(sys.stdin)['items']; m=[j for j in jobs if j.get('name')=='helm-smoke']; print(m[0]['status'] if m else 'MISSING')")
            echo "helm-smoke status: $STATUS"
            case "$STATUS" in
              COMPLETED) exit 0 ;;
              FAILED|CANCELLED) echo "job ended $STATUS" >&2; exit 1 ;;
            esac
            sleep 5
          done
          echo "job did not complete in time" >&2
          exit 1

      # A regenerated password would lock the server out of the existing
      # database: the upgrade must keep every stored credential.
      - name: "Upgrade keeps credentials"
        run: |
          read_secret() { kubectl get secret aaiclick-credentials -o jsonpath='{.data}'; }
          BEFORE=$(read_secret)
          helm upgrade aaiclick deploy/helm/aaiclick --reuse-values --wait --timeout 10m
          [ "$(read_secret)" = "$BEFORE" ] || { echo "helm upgrade changed the credentials" >&2; exit 1; }
          kubectl rollout status deploy/aaiclick-server --timeout 5m
          kubectl exec deploy/aaiclick-server -- python -c "import urllib.request; urllib.request.urlopen('http://localhost:5255/health', timeout=5)"

      - name: Dump cluster diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get events --sort-by=.lastTimestamp || true
          for p in $(kubectl get pods -o name 2>/dev/null); do
            echo "===== describe $p ====="; kubectl describe "$p" || true
            echo "===== logs $p ====="; kubectl logs "$p" --tail=80 || true
          done
