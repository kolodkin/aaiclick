name: test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup uv
        uses: ./.github/actions/setup-uv
        with:
          sync-args: "--extra docs"

      - name: Build docs (strict)
        run: uv run mkdocs build --strict

  chart:
    # Lint and render the published chart (deploy/helm/check.sh) so a broken
    # template shows on the PR, not at release.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Same Helm as the release gate (.github/actions/setup-k3s).
      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Check chart
        run: bash deploy/helm/check.sh

  java-sdk:
    # aaiclick-task-api Maven suite — infra-free (per-test temp dirs on the
    # file data plane).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run Maven verify
        run: mvn -B -f java/pom.xml verify

  tests:
    uses: ./.github/workflows/_test-reusable.yaml
    with:
      python-version: "3.11"
