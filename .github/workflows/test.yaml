name: test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup uv
        uses: ./.github/actions/setup-uv
        with:
          sync-args: "--extra docs"

      - name: Build docs (strict)
        run: uv run mkdocs build --strict

  tests:
    uses: ./.github/workflows/_test-reusable.yaml
    with:
      python-version: "3.10"

  java-worker:
    # Maven unit tests (Testcontainers on the runner's Docker), then the
    # cross-language e2e: Python submits a shell job into a Python-migrated
    # schema and the Java worker jar executes it. The e2e is the drift guard
    # for java/aaiclick-worker/src/test/resources/schema.sql.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.3
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: click123
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 0
        ports:
          - 8123:8123
          - 9000:9000
        options: >-
          --health-cmd "wget --spider -q localhost:8123/ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:18.3
        env:
          POSTGRES_USER: aaiclick
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: aaiclick
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aaiclick"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and unit test
        working-directory: java
        run: mvn -B package

      - name: Setup uv
        uses: ./.github/actions/setup-uv
        with:
          python-version: "3.10"
          sync-args: "--extra distributed --extra test"

      - name: Run database migrations
        env:
          AAICLICK_SQL_URL: "postgresql+asyncpg://aaiclick:secret@localhost:5432/aaiclick"
          AAICLICK_CH_URL: "clickhouse://default:click123@localhost:8123/default"
        run: uv run python -m aaiclick migrate upgrade head

      - name: Run cross-language e2e
        env:
          AAICLICK_SQL_URL: "postgresql+asyncpg://aaiclick:secret@localhost:5432/aaiclick"
          AAICLICK_CH_URL: "clickhouse://default:click123@localhost:8123/default"
          AAICLICK_JAVA_WORKER_JAR: ${{ github.workspace }}/java/aaiclick-worker/target/aaiclick-worker-0.0.1-SNAPSHOT.jar
        run: uv run pytest aaiclick/orchestration/execution/test_java_worker_e2e.py -v
