name: test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install docs dependencies
        run: uv sync --frozen --extra docs --python 3.10

      - name: Build docs (strict)
        run: uv run mkdocs build --strict

  tests:
    uses: ./.github/workflows/_test-reusable.yaml
    with:
      python-version: "3.10"
