name: Kubernetes Runner E2E (nightly)

# Validated on-branch via a temporary push trigger (a `schedule` cron only
# fires from the default branch), then switched to nightly — mirrors
# test-docker-nightly.yaml. The cron starts firing once this lands on `main`.

on:
  # Temporary push trigger to validate the kind-based reusable on-branch;
  # revert to schedule-only once green.
  push:
    branches: [claude/kubernetes-runner-support-rxv9hm]
    paths:
      - .github/workflows/_kubernetes-e2e-reusable.yaml
      - .github/workflows/test-k8s-nightly.yaml
      - test_e2e/kubernetes/**
      - test_e2e/fixtures/**
      - aaiclick/orchestration/execution/kubernetes_worker.py
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  e2e:
    uses: ./.github/workflows/_kubernetes-e2e-reusable.yaml
    with:
      wheel_source: source
