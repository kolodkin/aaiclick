<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>aaiclick UI mockup</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --border: #e3e6ea;
    --text: #1c2128;
    --muted: #6b7480;
    --accent: #2f6feb;
    --accent-soft: #eaf1fe;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

    /* status colors */
    --gray: #6b7480;     --gray-bg: #eceef1;
    --blue: #2f6feb;     --blue-bg: #e7f0ff;
    --green: #1a7f37;    --green-bg: #e6f4ea;
    --red: #cf222e;      --red-bg: #fce8e9;
    --yellow: #9a6700;   --yellow-bg: #fbf3d6;
    --purple: #8250df;   --purple-bg: #f1ebfb;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: var(--bg);
    display: flex;
    flex-direction: column;
  }

  /* ---- fixed header ---- */
  header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 1px 2px rgba(0,0,0,.03);
    z-index: 10;
  }
  .logo {
    font-weight: 700;
    letter-spacing: -.02em;
    font-size: 16px;
    white-space: nowrap;
  }
  .logo span { color: var(--accent); }
  .prompt-wrap { flex: 1; position: relative; }
  #prompt {
    width: 100%;
    font: 14px var(--mono);
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    outline: none;
  }
  #prompt:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px var(--accent-soft); }
  .hint { color: var(--muted); font-size: 12px; white-space: nowrap; }

  /* ---- content area ---- */
  main { flex: 1 1 auto; overflow: auto; padding: 22px; }
  .content { max-width: 1040px; margin: 0 auto; }

  h2 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 18px; }

  /* command chips */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .chip {
    font: 12px var(--mono);
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--panel);
    cursor: pointer;
    color: var(--accent);
  }
  .chip:hover { background: var(--accent-soft); }

  /* help / home cards */
  .cmd-list { display: grid; gap: 10px; }
  .cmd {
    display: grid; grid-template-columns: 180px 1fr; gap: 16px;
    padding: 14px 16px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 10px;
    cursor: pointer;
  }
  .cmd:hover { border-color: var(--accent); }
  .cmd code { font: 13px var(--mono); color: var(--accent); }
  .cmd .desc { color: var(--muted); }

  /* tables */
  table { width: 100%; border-collapse: collapse; background: var(--panel);
    border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  thead th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--border); font-weight: 600;
  }
  tbody td { padding: 11px 14px; border-bottom: 1px solid var(--border); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr.clickable { cursor: pointer; }
  tbody tr.clickable:hover { background: var(--accent-soft); }
  .name-link { color: var(--accent); font-weight: 600; }
  .mono { font-family: var(--mono); font-size: 13px; }

  /* badges */
  .badge {
    display: inline-block; font-size: 12px; font-weight: 600;
    padding: 2px 9px; border-radius: 999px; line-height: 1.5;
  }
  .b-PENDING   { color: var(--gray);   background: var(--gray-bg); }
  .b-CLAIMED   { color: var(--purple); background: var(--purple-bg); }
  .b-RUNNING   { color: var(--blue);   background: var(--blue-bg); }
  .b-COMPLETED { color: var(--green);  background: var(--green-bg); }
  .b-FAILED    { color: var(--red);    background: var(--red-bg); }
  .b-CANCELLED { color: var(--yellow); background: var(--yellow-bg); }

  /* progress */
  .progress { display: flex; align-items: center; gap: 8px; }
  .bar { flex: 1; max-width: 120px; height: 6px; border-radius: 999px; background: var(--gray-bg); overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--green); }

  /* detail header */
  .detail-head {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; margin-bottom: 16px;
  }
  .detail-head h2 { display: flex; align-items: center; gap: 10px; }
  .meta { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 10px 24px; margin-top: 12px; }
  .meta div { font-size: 13px; }
  .meta .k { color: var(--muted); display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; }
  .err { color: var(--red); background: var(--red-bg); border-radius: 8px; padding: 10px 12px; margin-top: 12px; font-family: var(--mono); font-size: 12px; }

  /* log viewer */
  .logs {
    background: #0d1117; color: #c9d1d9; border-radius: 10px;
    font: 12.5px/1.6 var(--mono); padding: 14px 16px; overflow: auto;
    max-height: 52vh; border: 1px solid #1f2630;
  }
  .logs .ts { color: #6b7480; }
  .logs .lvl-INFO { color: #79c0ff; }
  .logs .lvl-WARN { color: #e3b341; }
  .logs .lvl-ERROR { color: #ff7b72; }

  .note { margin-top: 26px; padding: 12px 14px; border-left: 3px solid var(--accent);
    background: var(--accent-soft); color: #2a3f63; border-radius: 0 8px 8px 0; font-size: 13px; }
</style>
</head>
<body>
  <header>
    <div class="logo">aai<span>click</span></div>
    <div class="prompt-wrap">
      <input id="prompt" placeholder="Type a command…  try @jobs" autocomplete="off" spellcheck="false" />
    </div>
    <div class="hint">prompt drives the view ↑</div>
  </header>
  <main>
    <div class="content" id="content"></div>
  </main>

<script>
/* ---------- sample data ---------- */
const JOBS = {
  "nyc_taxi_pipeline": {
    name: "nyc_taxi_pipeline", status: "RUNNING",
    created: "4m ago", started: "4m ago", completed: null, error: null,
    done: 2, total: 4, duration: "4m 12s",
    tasks: [
      { id: 4101, name: "download_trips", status: "COMPLETED", entry: "tasks.download", attempt: "1/3", started: "4m ago", duration: "38s" },
      { id: 4102, name: "parse_trips",    status: "COMPLETED", entry: "tasks.parse",    attempt: "1/3", started: "3m ago", duration: "1m 02s" },
      { id: 4103, name: "aggregate_zones",status: "RUNNING",   entry: "tasks.aggregate",attempt: "1/3", started: "2m ago", duration: "2m 09s" },
      { id: 4104, name: "build_report",   status: "PENDING",   entry: "tasks.report",   attempt: "0/3", started: "—",      duration: "—" },
    ],
  },
  "imdb_dataset_builder": {
    name: "imdb_dataset_builder", status: "FAILED",
    created: "1h ago", started: "1h ago", completed: "58m ago", error: "tasks.enrich: HTTPError 429 from api.themoviedb.org (rate limited)",
    done: 2, total: 3, duration: "2m 41s",
    tasks: [
      { id: 3990, name: "load_titles",  status: "COMPLETED", entry: "tasks.load",   attempt: "1/3", started: "1h ago",  duration: "1m 11s" },
      { id: 3991, name: "load_ratings", status: "COMPLETED", entry: "tasks.load",   attempt: "1/3", started: "1h ago",  duration: "44s" },
      { id: 3992, name: "enrich_meta",  status: "FAILED",    entry: "tasks.enrich", attempt: "3/3", started: "59m ago", duration: "46s" },
    ],
  },
  "cyber_threat_feeds": {
    name: "cyber_threat_feeds", status: "COMPLETED",
    created: "2h ago", started: "2h ago", completed: "2h ago", error: null,
    done: 3, total: 3, duration: "3m 05s",
    tasks: [
      { id: 3801, name: "fetch_epss",   status: "COMPLETED", entry: "epss.fetch",  attempt: "1/3", started: "2h ago", duration: "52s" },
      { id: 3802, name: "fetch_kev",    status: "COMPLETED", entry: "kev.fetch",   attempt: "1/3", started: "2h ago", duration: "31s" },
      { id: 3803, name: "merge_feeds",  status: "COMPLETED", entry: "feeds.merge", attempt: "1/3", started: "2h ago", duration: "1m 42s" },
    ],
  },
};
const JOB_ORDER = ["nyc_taxi_pipeline", "imdb_dataset_builder", "cyber_threat_feeds"];
const JOB_CREATED = { nyc_taxi_pipeline: "4m ago", imdb_dataset_builder: "1h ago", cyber_threat_feeds: "2h ago" };

const TASK_INDEX = {};
for (const j of Object.values(JOBS)) for (const t of j.tasks) TASK_INDEX[t.id] = { ...t, job: j.name };

const LOGS = {
  4103: [
    ["12:04:31", "INFO",  "claimed task aggregate_zones (worker mp-3)"],
    ["12:04:31", "INFO",  "reading p_trips (8,420,113 rows)"],
    ["12:05:02", "INFO",  "group_by pickup_zone -> 263 groups"],
    ["12:05:48", "WARN",  "zone 265 has 0 trips, skipping"],
    ["12:06:12", "INFO",  "writing t_zone_stats … 41% (108/263)"],
  ],
  3992: [
    ["11:59:02", "INFO",  "claimed task enrich_meta (worker mp-1), attempt 3/3"],
    ["11:59:03", "INFO",  "enriching 12,004 titles via themoviedb"],
    ["11:59:41", "WARN",  "429 received, backing off 8s"],
    ["11:59:49", "ERROR", "HTTPError 429 from api.themoviedb.org (rate limited)"],
    ["11:59:49", "ERROR", "task failed after 3 attempts; marking FAILED"],
  ],
};

/* ---------- helpers ---------- */
const $ = (sel) => document.querySelector(sel);
const badge = (s) => `<span class="badge b-${s}">${s}</span>`;
const el = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; };
function setPrompt(v) { $("#prompt").value = v; render(); }

/* ---------- views ---------- */
function viewHome() {
  return `
    <h2>aaiclick</h2>
    <p class="sub">Prompt-driven operator dashboard. Type a command above, or click one below.</p>
    <div class="cmd-list">
      <div class="cmd" data-cmd="@jobs"><code>@jobs</code><span class="desc">List all jobs, newest first. Click a row to drill in.</span></div>
      <div class="cmd" data-cmd="@job nyc_taxi_pipeline"><code>@job &lt;name&gt;</code><span class="desc">Job detail — header + tasks table.</span></div>
      <div class="cmd" data-cmd="@task 4103"><code>@task &lt;id&gt;</code><span class="desc">Task detail — status bar + live log viewer.</span></div>
    </div>
    <div class="note">Mockup. Everything is sample data; clicking rows/chips just rewrites the prompt to show how navigation feels.</div>`;
}

function viewJobs() {
  const rows = JOB_ORDER.map((name) => {
    const j = JOBS[name];
    const pct = Math.round((j.done / j.total) * 100);
    return `<tr class="clickable" data-cmd="@job ${name}">
      <td><span class="name-link mono">${name}</span></td>
      <td>${badge(j.status)}</td>
      <td><div class="progress"><div class="bar"><span style="width:${pct}%"></span></div><span class="mono">${j.done}/${j.total}</span></div></td>
      <td>${JOB_CREATED[name]}</td>
      <td class="mono">${j.duration}</td>
    </tr>`;
  }).join("");
  return `
    <h2>Jobs</h2>
    <p class="sub">Sorted by created_at, newest first · auto-refreshes via SSE</p>
    <div class="chips"><span class="chip" data-cmd="">← home</span></div>
    <table>
      <thead><tr><th>Name</th><th>Status</th><th>Progress</th><th>Created</th><th>Duration</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function viewJob(name) {
  const j = JOBS[name];
  if (!j) return `<h2>Job not found</h2><p class="sub mono">${name}</p><div class="chips"><span class="chip" data-cmd="@jobs">@jobs</span></div>`;
  const rows = j.tasks.map((t) => `
    <tr class="clickable" data-cmd="@task ${t.id}">
      <td><span class="name-link mono">${t.name}</span></td>
      <td>${badge(t.status)}</td>
      <td class="mono">${t.entry}</td>
      <td class="mono">${t.attempt}</td>
      <td>${t.started}</td>
      <td class="mono">${t.duration}</td>
    </tr>`).join("");
  return `
    <div class="chips"><span class="chip" data-cmd="@jobs">← @jobs</span></div>
    <div class="detail-head">
      <h2><span class="mono">${j.name}</span> ${badge(j.status)}</h2>
      <div class="meta">
        <div><span class="k">Created</span>${j.created}</div>
        <div><span class="k">Started</span>${j.started}</div>
        <div><span class="k">Completed</span>${j.completed ?? "—"}</div>
        <div><span class="k">Duration</span>${j.duration}</div>
        <div><span class="k">Progress</span>${j.done}/${j.total} tasks</div>
      </div>
      ${j.error ? `<div class="err">${j.error}</div>` : ""}
    </div>
    <table>
      <thead><tr><th>Name</th><th>Status</th><th>Entrypoint</th><th>Attempt</th><th>Started</th><th>Duration</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function viewTask(id) {
  const t = TASK_INDEX[id];
  if (!t) return `<h2>Task not found</h2><p class="sub mono">#${id}</p><div class="chips"><span class="chip" data-cmd="@jobs">@jobs</span></div>`;
  const logs = (LOGS[id] || [["—","INFO","(no logs captured for this sample task)"]])
    .map(([ts, lvl, msg]) => `<div><span class="ts">${ts}</span> <span class="lvl-${lvl}">${lvl.padEnd(5)}</span> ${msg}</div>`).join("");
  return `
    <div class="chips">
      <span class="chip" data-cmd="@jobs">@jobs</span>
      <span class="chip" data-cmd="@job ${t.job}">← @job ${t.job}</span>
    </div>
    <div class="detail-head">
      <h2><span class="mono">${t.name}</span> ${badge(t.status)}</h2>
      <div class="meta">
        <div><span class="k">Task ID</span><span class="mono">#${id}</span></div>
        <div><span class="k">Job</span><span class="mono">${t.job}</span></div>
        <div><span class="k">Entrypoint</span><span class="mono">${t.entry}</span></div>
        <div><span class="k">Attempt</span><span class="mono">${t.attempt}</span></div>
        <div><span class="k">Worker</span><span class="mono">mp-3</span></div>
        <div><span class="k">Started</span>${t.started}</div>
        <div><span class="k">Duration</span>${t.duration}</div>
      </div>
    </div>
    <div class="logs">${logs}</div>`;
}

/* ---------- router (prompt -> view) ---------- */
function render() {
  const raw = $("#prompt").value.trim();
  let html;
  if (raw === "") html = viewHome();
  else if (raw === "@jobs") html = viewJobs();
  else if (raw.startsWith("@job ")) html = viewJob(raw.slice(5).trim());
  else if (raw.startsWith("@task ")) html = viewTask(parseInt(raw.slice(6).trim(), 10));
  else html = `<h2>Unknown command</h2><p class="sub mono">${raw}</p><div class="chips"><span class="chip" data-cmd="">help</span><span class="chip" data-cmd="@jobs">@jobs</span></div>`;
  const c = $("#content");
  c.innerHTML = html;
  c.querySelectorAll("[data-cmd]").forEach((node) =>
    node.addEventListener("click", () => setPrompt(node.getAttribute("data-cmd")))
  );
}

$("#prompt").addEventListener("input", render);
render();
</script>
</body>
</html>
