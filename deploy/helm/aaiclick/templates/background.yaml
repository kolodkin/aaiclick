# Background cleanup worker: drives job completion and periodic cleanup,
# the same role the `background` service plays in the compose stack.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aaiclick-background
  labels:
    app: aaiclick-background
spec:
  replicas: {{ .Values.background.replicas }}
  selector:
    matchLabels:
      app: aaiclick-background
  template:
    metadata:
      labels:
        app: aaiclick-background
      annotations:
        {{- include "aaiclick.credentialsChecksum" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-server
          image: {{ include "aaiclick.image" (dict "root" $ "image" .Values.images.server) | quote }}
          command:
            - /bin/sh
            - -c
            - >-
              until python -c "import urllib.request;
              urllib.request.urlopen('http://aaiclick-server:{{ .Values.server.service.port }}/health', timeout=2)";
              do echo "waiting for aaiclick-server"; sleep 3; done
      containers:
        - name: background
          image: {{ include "aaiclick.image" (dict "root" $ "image" .Values.images.server) | quote }}
          command: ["python", "-m", "aaiclick", "background", "start"]
          env:
            {{- include "aaiclick.secretEnv" (dict "root" $ "name" "AAICLICK_SQL_URL" "key" "sql-url") | nindent 12 }}
            {{- include "aaiclick.secretEnv" (dict "root" $ "name" "AAICLICK_CH_URL" "key" "ch-url") | nindent 12 }}
          resources:
            {{- toYaml .Values.background.resources | nindent 12 }}
