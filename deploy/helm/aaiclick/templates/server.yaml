apiVersion: apps/v1
kind: Deployment
metadata:
  name: aaiclick-server
  labels:
    app: aaiclick-server
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels:
      app: aaiclick-server
  template:
    metadata:
      labels:
        app: aaiclick-server
      annotations:
        {{- include "aaiclick.credentialsChecksum" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Migrations run here rather than as a helm hook: pre-install hooks
      # execute before chart resources exist, which can never succeed when
      # the databases are in-chart (devDependencies). The pod restarts with
      # backoff until the database is reachable, then the server starts.
      initContainers:
        - name: migrate
          image: {{ include "aaiclick.image" (dict "root" $ "image" .Values.images.server) | quote }}
          command: ["python", "-m", "aaiclick", "migrate", "upgrade", "head"]
          env:
            {{- include "aaiclick.dbEnv" . | nindent 12 }}
      containers:
        - name: server
          image: {{ include "aaiclick.image" (dict "root" $ "image" .Values.images.server) | quote }}
          ports:
            - containerPort: 5255
          env:
            {{- include "aaiclick.dbEnv" . | nindent 12 }}
            {{- include "aaiclick.secretEnv" (dict "root" $ "name" "AAICLICK_JWT_SECRET" "key" "jwt-secret") | nindent 12 }}
            {{- include "aaiclick.secretEnv" (dict "root" $ "name" "AAICLICK_ADMIN_PASSWORD" "key" "admin-password") | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: 5255
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: aaiclick-server
  labels:
    app: aaiclick-server
spec:
  type: {{ .Values.server.service.type }}
  selector:
    app: aaiclick-server
  ports:
    - name: http
      port: {{ .Values.server.service.port }}
      targetPort: 5255
