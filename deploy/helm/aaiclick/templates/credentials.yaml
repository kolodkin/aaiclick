{{- /*
Every credential the chart's pods read. Each value is the one set in values,
else the one already stored in this Secret (so `helm upgrade` keeps it), else
random. Skipped entirely when auth.existingSecret names a Secret managed
outside Helm. `lookup` is empty under `helm template` / Argo CD, so those
regenerate every render: use auth.existingSecret there.
*/ -}}
{{- if not .Values.auth.existingSecret }}
{{- $name := include "aaiclick.credentialsSecret" . }}
{{- $stored := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $pick := dict }}
{{- $wanted := dict "jwt-secret" (list .Values.auth.jwtSecret 48) "admin-password" (list .Values.auth.adminPassword 24) }}
{{- if .Values.devDependencies.enabled }}
{{- $_ := set $wanted "pg-password" (list .Values.devDependencies.postgres.password 24) }}
{{- $_ := set $wanted "ch-password" (list .Values.devDependencies.clickhouse.password 24) }}
{{- end }}
{{- range $key, $spec := $wanted }}
{{- $value := (index $spec 0) | default (index $stored $key | default "" | b64dec) | default (randAlphaNum (index $spec 1)) }}
{{- $_ := set $pick $key $value }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    # Survive `helm uninstall`, so a reinstall keeps the database passwords.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $key, $value := $pick }}
  {{ $key }}: {{ $value | b64enc }}
  {{- end }}
  sql-url: {{ include "aaiclick.sqlUrl" (dict "root" $ "password" (get $pick "pg-password")) | b64enc }}
  ch-url: {{ include "aaiclick.chUrl" (dict "root" $ "password" (get $pick "ch-password")) | b64enc }}
{{- end }}
