apiVersion: apps/v1
kind: Deployment
metadata:
  name: aaiclick-registry
  labels:
    app: aaiclick-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aaiclick-registry
  template:
    metadata:
      labels:
        app: aaiclick-registry
    spec:
      containers:
        - name: registry
          image: {{ .Values.registry.image }}
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /v2/
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: aaiclick-registry
  labels:
    app: aaiclick-registry
spec:
  type: NodePort
  selector:
    app: aaiclick-registry
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: {{ .Values.registry.nodePort }}
