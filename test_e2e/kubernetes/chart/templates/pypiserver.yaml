apiVersion: apps/v1
kind: Deployment
metadata:
  name: aaiclick-pypiserver
  labels:
    app: aaiclick-pypiserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aaiclick-pypiserver
  template:
    metadata:
      labels:
        app: aaiclick-pypiserver
    spec:
      containers:
        - name: pypiserver
          image: {{ .Values.pypiserver.image }}
          # Auth disabled (-a . -P .) — CI-only local index.
          args: ["run", "-p", "8080", "-a", ".", "-P", ".", "--server", "gunicorn"]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: aaiclick-pypiserver
  labels:
    app: aaiclick-pypiserver
spec:
  type: NodePort
  selector:
    app: aaiclick-pypiserver
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: {{ .Values.pypiserver.nodePort }}
