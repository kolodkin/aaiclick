apiVersion: apps/v1
kind: Deployment
metadata:
  name: aaiclick-clickhouse
  labels:
    app: aaiclick-clickhouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aaiclick-clickhouse
  template:
    metadata:
      labels:
        app: aaiclick-clickhouse
    spec:
      containers:
        - name: clickhouse
          image: {{ .Values.clickhouse.image }}
          env:
            - name: CLICKHOUSE_USER
              value: {{ .Values.clickhouse.user | quote }}
            - name: CLICKHOUSE_PASSWORD
              value: {{ .Values.clickhouse.password | quote }}
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "0"
          ports:
            - containerPort: 8123
            - containerPort: 9000
          readinessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: aaiclick-clickhouse
  labels:
    app: aaiclick-clickhouse
spec:
  type: NodePort
  selector:
    app: aaiclick-clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: 8123
      nodePort: {{ .Values.clickhouse.nodePort }}
